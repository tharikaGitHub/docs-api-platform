# Project information
site_name: "API Platform Documentation"
site_description: API Platform Documentation
site_author: WSO2
site_url: https://wso2.com/api-platform/docs


# Repository
repo_name: wso2/docs-api-platform
repo_url: https://github.com/wso2/docs-api-platform
edit_uri: https://github.com/wso2/docs-api-platform/edit/cloud-api-platform/en/docs/
dev_addr: localhost:8000

# Copyright
copyright: ©2026 WSO2 LLC.

# Configuration
watch:
  - theme/
  - docs/assets/

theme:
  name: material
  custom_dir: theme/material
  logo: assets/images/APIPlatformDocs.svg
  logo_light: assets/images/APIPlatformDocsWhite.svg
  font:
    text: Montserrat
  favicon: assets/images/favicon.png
  features:
    # Fetch pages with XHR and swap the content in place instead of reloading
    # the whole window. Per-page JavaScript must run from document$, not
    # DOMContentLoaded (see docs/assets/js/theme.js).
    - navigation.instant
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.action.view
  language: "en"
  palette:
    # Palette toggle for light mode
       - media: "(prefers-color-scheme: light)"
         scheme: default 
         toggle:
          icon: assets/libs/oxygen-ui-icons/1.7.3/crescent-bright-16.svg
          name: Switch to dark mode
      # Palette toggle for dark mode
       - media: "(prefers-color-scheme: dark)"
         scheme: slate
         toggle:
           icon: assets/libs/oxygen-ui-icons/1.7.3/sun-16.svg
           name: Switch to light mode

  icon:
    logo: logo
#Breaks build if there's a warning
strict: false

# Navigation
#
# First cut for the new API Platform Cloud (branch: cloud-api-platform).
# Every page has a comment saying where its content comes from:
#   "from: <path>"  adapt the Bijira page at that path (cloud branch, en/docs/)
#   "new"           no Bijira equivalent; write from scratch
# Lines commented out with "pending:" are candidates that are not in the
# release feature list yet; enable them once the feature is confirmed.
nav:
  # Overview and Get Started are platform-common pages; theme.js rewrites
  # these links from root-index.json's _platformCommonBase at runtime.
  - Overview: https://50dcbee2-0809-4bf1-801f-b820c18e9816.e1-us-east-azure.choreoapps.dev/
  - Get Started: https://50dcbee2-0809-4bf1-801f-b820c18e9816.e1-us-east-azure.choreoapps.dev/get-started/
  - API Platform Cloud:
    - Introduction:
        - What is API Platform Cloud?: api-platform-cloud/index.md                                  # from: introduction/what-is-bijira.md
        - Key Concepts: api-platform-cloud/introduction/key-concepts.md                             # from: bijira-concepts/organization.md, project.md, data-planes.md
    - Getting Started:
        - Sign Up and Activate Your Subscription: api-platform-cloud/getting-started/sign-up.md     # new
        - Sign In and Organizations: api-platform-cloud/getting-started/sign-in-and-organizations.md  # from: bijira-concepts/organization.md, administer/configure-enterprise-login/configure-enterprise-login.md
        - Tour of the Management Portal: api-platform-cloud/getting-started/management-portal-tour.md  # new
        - Quick Start Guide: api-platform-cloud/getting-started/quick-start-guide.md                # from: introduction/quick-start-guide.md
    - Develop APIs:
        - Create an API: api-platform-cloud/develop-apis/create-an-api.md                           # from: create-api-proxy/overview.md and create-api-proxy/my-apis/** (only the API types and methods supported at launch)
        - Policies:
            - Apply Policies: api-platform-cloud/develop-apis/policies/apply-policies.md             # from: develop-api-proxy/policy/overview.md, policies.md, attach-and-manage-policies.md
            - Configure Policy System Parameters: api-platform-cloud/develop-apis/policies/configure-system-parameters.md  # new
            - Custom Policies: api-platform-cloud/develop-apis/policies/custom-policies.md           # from: api-platform-gateway/apply-custom-policies-to-apis.md
            - Build a Custom Policy with Go: api-platform-cloud/develop-apis/policies/build-a-custom-policy-with-go.md  # from: api-platform-gateway/writing-a-custom-policy.md, build-gateway-with-custom-policies.md (only if Go extensibility ships for cloud)
        # pending: - Test an API: api-platform-cloud/develop-apis/test-an-api.md                     # from: test-api-proxy/openapi-console.md, curl.md
    - Secure APIs:
        - Secure APIs with OAuth 2.0: api-platform-cloud/secure-apis/secure-apis-with-oauth2.md      # from: develop-api-proxy/authentication-and-authorization/secure-api-access-with-bijira-sts.md
        - Manage Secrets: api-platform-cloud/secure-apis/manage-secrets.md                          # new
    - Deploy:
        - Environments: api-platform-cloud/deploy/environments.md                                   # from: administer/manage-environments/manage-environments.md
        - Promote APIs Between Environments: api-platform-cloud/deploy/promote-apis-between-environments.md  # from: administer/manage-cd-pipelines/manage-cd-pipelines.md
        - Gateways:
            - Internal and External Gateways: api-platform-cloud/deploy/gateways/internal-and-external-gateways.md  # new (concept framing from bijira-concepts/data-planes.md)
            - Custom Gateway Domains: api-platform-cloud/deploy/gateways/custom-gateway-domains.md   # from: administer/settings/configure-a-custom-domain-for-your-organization.md (Bijira is per organization; this is per gateway)
    - Publish and Consume:
        - Publish APIs to the Developer Portal: api-platform-cloud/publish-and-consume/publish-apis-to-the-developer-portal.md  # from: develop-api-proxy/lifecycle-management.md, api-platform-gateway/publish-apis/*.md
        # pending: - Subscription Plans: api-platform-cloud/publish-and-consume/subscription-plans.md  # from: develop-api-proxy/subscription-plans.md, administer/settings/create-api-subscription-plans.md
        - Developer Portal: api-platform-cloud/publish-and-consume/developer-portal.md              # from: devportal/** (keep short; link to the API Portal component docs)
        - AI Workspace: api-platform-cloud/publish-and-consume/ai-workspace.md                      # from: ai-workspace/overview.md (keep short; link to the AI Workspace component docs)
    - Govern:
        - API Governance: api-platform-cloud/govern/api-governance.md                               # from: governance/overview.md, governance/govern-api-proxy.md
    # pending: - Monitor:
    # pending:     - Logs: api-platform-cloud/monitor/logs.md                                         # from: monitoring-and-insights/logs/*.md
    # pending:     - Status Page: api-platform-cloud/monitor/status-page.md                           # from: monitoring-and-insights/status-page.md
    - Administer:
        - Users and Roles: api-platform-cloud/administer/users-and-roles.md                         # new
        - Event Notifications: api-platform-cloud/administer/event-notifications.md                 # new
    - Platform API:
        - Overview and Authentication: api-platform-cloud/platform-api/overview.md                  # new
        - Events Reference: api-platform-cloud/platform-api/events-reference.md                     # new
        - API Reference: api-platform-cloud/platform-api/api-reference.md                           # new

markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs
  - attr_list
hooks:
  - hooks.py

plugins:
  - search
  - include-markdown
  - glightbox
  - open-in-new-tab
  - markdownextradata: {}
  - redirects:
      redirect_maps: {}  # Do not add redirects here. Add them to redirects.yml instead.
extra_css:
  - assets/lib/highlightjs/default.min.css
  - assets/css/theme.css
  - assets/css/api-manager-legacy.css
  - assets/lib/json-formatter/json-formatter.css
extra_javascript:
  - assets/lib/json-formatter/json-formatter.umd.js
  - assets/lib/highlightjs/highlight.min.js
  - https://8c140a8d-7209-401b-84ab-2aebe8deaa80.e1-us-east-azure.choreoapps.dev/theme.js
extra:
  show_repo_in_nav: false
  page_title_suffix: "API Platform Docs"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wso2
  # No versioned sections: the cloud is unversioned.
  versioned_sections: {}
  # Slug "api-platform-cloud" makes the hooks write
  # api-platform-cloud/product-nav-manifest.json, so other deployments can
  # render this section in their sidebars. It is separate from Bijira's
  # "cloud" slug so both can run side by side for now; Bijira keeps /cloud/
  # and its existing links until the move to /cloud/ and its redirects.
  unversioned_sections:
    API Platform Cloud:
      slug: api-platform-cloud
  expanded_navs:
    - title: API Platform Cloud
      options:
        - verticle-line
    - title: Develop APIs
      options:
        - verticle-line-only
    - title: Deploy
      options:
        - verticle-line-only
    - title: Administer
      options:
        - verticle-line-only
    - title: Platform API
      options:
        - verticle-line-only
  nav_icons:
    Overview:
      icon: octicons/apps-16
      level: 1
    Get Started:
      icon: octicons/rocket-16
      level: 1
    API Platform Cloud:
      icon: octicons/cloud-16
      level: 1
    Introduction:
      icon: octicons/info-16
      level: 1
    Getting Started:
      icon: octicons/play-16
      level: 1
    Develop APIs:
      icon: octicons/tools-16
      level: 1
    Secure APIs:
      icon: octicons/shield-lock-16
      level: 1
    Deploy:
      icon: octicons/git-branch-16
      level: 1
    Publish and Consume:
      icon: octicons/book-16
      level: 1
    Govern:
      icon: octicons/law-16
      level: 1
    Monitor:
      icon: octicons/graph-16
      level: 1
    Administer:
      icon: octicons/lock-16
      level: 1
    Platform API:
      icon: octicons/code-16
      level: 1
