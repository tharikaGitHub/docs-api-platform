markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs
  - attr_list
hooks:
  - hooks.py

plugins:
  - search
  - include-markdown
  - glightbox
  - open-in-new-tab
  - markdownextradata: {}
  - redirects:
      redirect_maps: {}  # Do not add redirects here. Add them to redirects.yml instead.
extra_css:
  - cloud/platform/assets/lib/highlightjs/default.min.css
  - assets/css/theme.css
  - cloud/platform/assets/css/api-manager-legacy.css
  - cloud/platform/assets/lib/json-formatter/json-formatter.css
extra_javascript:
  - cloud/platform/assets/lib/json-formatter/json-formatter.umd.js
  - cloud/platform/assets/lib/highlightjs/highlight.min.js
  - https://8c140a8d-7209-401b-84ab-2aebe8deaa80.e1-us-east-azure.choreoapps.dev/theme.js
extra:
  show_repo_in_nav: false
  page_title_suffix: "API Platform Docs"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wso2
  # No versioned sections: the cloud is unversioned.
  versioned_sections: {}
  # Slug "cloud/platform" makes the hooks write
  # cloud/platform/product-nav-manifest.json, so other deployments can render
  # this section in their sidebars. It sits under Bijira's "cloud" slug:
  # Bijira keeps /cloud/ and its existing links, and the gateway routes
  # /cloud/platform/ to this deployment ahead of /cloud/.
  unversioned_sections:
    API Platform Cloud:
      slug: cloud/platform
  expanded_navs:
    - title: API Platform Cloud
      options:
        - verticle-line
    - title: Develop APIs
      options:
        - verticle-line-only
    - title: Deploy
      options:
        - verticle-line-only
    - title: Administer
      options:
        - verticle-line-only
    - title: Platform API
      options:
        - verticle-line-only
  nav_icons:
    Overview:
      icon: octicons/apps-16
      level: 1
    Get Started:
      icon: octicons/rocket-16
      level: 1
    API Platform Cloud:
      icon: octicons/cloud-16
      level: 1
    Introduction:
      icon: octicons/info-16
      level: 1
    Getting Started:
      icon: octicons/play-16
      level: 1
    Develop APIs:
      icon: octicons/tools-16
      level: 1
    Secure APIs:
      icon: octicons/shield-lock-16
      level: 1
    Deploy:
      icon: octicons/git-branch-16
      level: 1
    Publish and Consume:
      icon: octicons/book-16
      level: 1
    Govern:
      icon: octicons/law-16
      level: 1
    Monitor:
      icon: octicons/graph-16
      level: 1
    Administer:
      icon: octicons/lock-16
      level: 1
    Platform API:
      icon: octicons/code-16
      level: 1
