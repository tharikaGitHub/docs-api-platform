server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Redirect all temp paths to /tmp (writable in read-only filesystems)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The docs open on the API Platform Cloud docs (a separate deployment at
    # /saas/), as the Cloud / Self-managed toggle defaults to Cloud;
    # Self-managed has its own landing page at /self-managed/. The target is
    # relative so it stays under the public prefix the browser is already using.
    location = / {
        default_type text/html;
        return 200 "<!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Redirecting...</title>\n    <link rel=\"canonical\" href=\"saas/\">\n    <meta name=\"robots\" content=\"noindex\">\n    <script>var anchor=window.location.hash.substr(1);location.href=\"saas/\"+(anchor?\"#\"+anchor:\"\")</script>\n    <meta http-equiv=\"refresh\" content=\"0; url=saas/\">\n</head>\n<body>\nRedirecting...\n</body>\n</html>\n";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ =404;
        # Fetched cross-origin by every other product+version deployment's
        # pages, to render this product's section in their sidebar.
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
